- id: "1"
  title: Build the ODP dataset, workspace route, and single-parameter entry
  description: >-
    Stand up the build-time ODP dataset endpoint, the /workspace/{baseline}
    route, and the ability to set/confirm/override one parameter at a time
    with rationale, persisted to localStorage. Covers CAP-2 and CAP-5; this
    is the foundation stories 2-4 build on.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Follow AD-8 (dataset derives from the committed Content Collection via
    getCollection('controls'), never from raw OSCAL) and AD-10 (one JSON
    blob per baseline, one shared odpStore.ts module, corrupt/missing blob
    treated as empty state, never a crash). Decision `value` is
    `string | string[]` from the start -- 97 real parameters need multi-select,
    including one on every dash-one control -- do not build the single-string
    case first and retrofit.

- id: "2"
  title: Add batched dash-one entry
  description: >-
    Add the dash-one cluster view: set a shared parameter once and fan it
    out to all matching controls as independent, individually overridable
    decisions. Covers CAP-1.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Follow AD-11: cluster membership is computed at read time only (paramId
    with the ^<familyCode>-1_ / ^<familyCode>-01_ prefix stripped), never
    stored as a cluster reference -- implement the matching function once in
    odpCluster.ts and import it from both the batch UI and (in story 3) the
    dashboard. "Still matches the batch value" comparison must be
    array-aware (order-independent set equality) for one-or-more parameters,
    not plain string equality.

- id: "3"
  title: Readiness gate and dashboard
  description: >-
    Add the baseline-level readiness view (counts by status, by Family) and
    the hard gate that blocks marking a baseline ready while any parameter
    is unreviewed-default. Covers CAP-3.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    The gate is a hard block, not a warning -- there is no way to mark a
    baseline ready with an unreviewed-default parameter still present. Reuse
    odpCluster.ts from story 2 for any cluster-aware grouping in the
    dashboard rather than reimplementing matching logic.

- id: "4"
  title: OSCAL export
  description: >-
    Serialize all current decisions for a baseline into a valid OSCAL
    Profile document and let the user download it. Covers CAP-4.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Follow AD-12: oscal-version "1.2.2" (the corpus's own ingested version,
    do not re-derive or hardcode a different one), one set-parameter per
    decision (fanned out from any batched cluster, never combined), `values:
    Array.isArray(value) ? value : [value]`, rationale in `remarks` when
    present. Validate the output manually with `oscal-cli validate` during
    development -- no schema validator ships in the client bundle.

- id: "5"
  title: Show each parameter's control and statement context
  description: >-
    Give every parameter row (individual and batch) enough context to be
    answerable on sight: the control's title, the statement sentence the
    parameter sits in, and -- on a batch row -- which controls it covers.
    Found by using the tool: a row reading `prm_1 / organization-defined
    personnel or roles` is unanswerable without the sentence it belongs to.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    The control title and statement tree already exist in the `controls`
    Content Collection but are NOT emitted by `odp-dataset.json.ts` -- extend
    that endpoint (AD-8 still applies: derive from getCollection('controls'),
    never raw OSCAL). Reuse the existing `src/utils/resolveParams.ts` to
    render `{{ insert: param, X }}` placeholders into readable Assignment/
    Selection text rather than writing a second resolver. Measure the
    dataset size impact before committing to shipping full statement prose
    per param instance (1600 entries corpus-wide).

- id: "6"
  title: Split the workspace into views with family and status filters
  description: >-
    Break the single 643-row Moderate page into three views (readiness
    dashboard, batch entry, individual parameters) plus a family selector
    and an unreviewed-only filter on the individual view, so the two
    distinct modes of work -- clearing the 9 batch clusters, then grinding
    the remaining 481 params -- stop competing for one scroll.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Stay inside the one `OdpWorkspace` island -- AD-9 ("renders exactly one
    client island that owns the entire flow") is NOT being amended here, so
    do not split into per-family routes. View and filter state belong in the
    URL query per AD-3, reusing `setUrlState()` from `src/utils/urlState.ts`
    rather than a second URL-writing path. Build rows on view/family switch
    rather than all 643 up front -- the goal is fewer DOM nodes, not just a
    shorter scroll.

- id: "7"
  title: Extract the shared decision-edit module
  description: >-
    Pull field construction, value read/write, override-rationale validation,
    and the batch fan-out loop out of the 1,475-line OdpWorkspace island into
    utils/odpEdit.ts, and amend AD-9 to make that module the sole owner of
    decision mutation semantics. No user-visible change. Prerequisite for
    every later story that edits a decision from outside the workspace.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    This is a pure refactor -- every existing workspace behavior must be
    byte-identical afterward (set, confirm, override with and without
    rationale, batch fan-out, dashboard refresh, export). AD-10 is unchanged:
    odpStore.ts stays the sole localStorage path. AD-9 is amended in this
    same story -- the code move and the invariant that justifies it land
    together, never separately. Extract the decision WRITES only: the
    rowRegistry refresh and refreshDashboard() calls currently interleaved
    with the fan-out loop stay with the caller, passed in as a callback.
    Importing rowRegistry into odpEdit.ts would just relocate the coupling.
    Verify with a grep that setDecision is called from odpEdit.ts and
    nowhere else.

- id: "8"
  title: Global active baseline and readiness chip
  description: >-
    Add a persisted, app-global "baseline I'm working in" (AD-13) with a
    selector and a readiness chip in the global header, linking to the
    workspace. Makes the workspace reachable for the first time --
    workspaceUrl() currently has zero call sites -- and gives every other
    page an unambiguous baseline to resolve decisions against.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    New invariant AD-13: one module (utils/activeBaseline.ts) owns the active
    baseline; no page infers a baseline from its own URL, content, or a
    hardcoded default. The workspace route's path baseline
    (/workspace/{baseline}) stays authoritative for its own page and writes
    back to the active baseline on mount, so the two never silently disagree.
    RESOLVED 2026-09-29: the per-page filter and the working baseline are TWO
    SEPARATE CONTROLS, not one. The filter answers "what do I want to see on
    this page" and keeps its All option; the working baseline answers "whose
    decisions am I making" and has no All. Split that way the All question
    disappears instead of needing an answer. Picking a filter value may OFFER
    to switch the working baseline but never does it silently; navigating to
    /workspace/high/ is unambiguous intent and does switch it. The readiness
    count needs the dataset, so the chip loads async: degrade to the baseline
    name alone, never flash 0/0. Legibility is the real risk here -- two
    baseline controls visible at once on Control and Family pages need
    visibly different treatments and unambiguous labels ("Viewing" vs
    "Working in") or users read them as one duplicated widget.

- id: "9"
  title: Addressable ODP slots showing decided values on control pages
  description: >-
    Change resolveParams to emit an addressable span carrying paramId and
    controlSlug instead of bare text, and add a client overlay that swaps in
    the user's decided value with a status treatment. Read-only -- a control
    page finally shows what the organization answered, not just what NIST
    asked. Editing arrives in story 10.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    AD-5 still holds: one resolver, still run once at build time. This adds
    an ADDRESS to its output, it does not add a second resolver or move
    resolution to the client. resolveParams currently returns a plain string
    consumed as a text child by StatementTree and EnhancementItem -- emitting
    markup means those call sites need set:html, so audit escaping carefully.
    Statement prose is NIST content, but the decided value substituted at
    runtime IS user input and must be written with textContent, never
    innerHTML. Keep the existing unresolved-placeholder fallback working (a
    param id with no matching entry renders verbatim) and give it no slot.
    The page must stay fully readable with JS disabled, showing NIST's
    default text. RESOLVED 2026-09-29, out-of-baseline items: 591 of 1014
    non-withdrawn items are in NO baseline and 395 of those carry params --
    754 params, 47% of the corpus. The workspace never shows them, so a slot
    there can never hold a decision. Render those slots as today's plain
    resolved text, NON-INTERACTIVE, with one explanation at the ODP-summary
    level ("not part of the Moderate baseline") and never per-slot -- a
    per-slot note would put a dead affordance on the majority of control
    pages to repeat one sentence. Deciding a parameter on an out-of-baseline
    control is OUT OF SCOPE: it would be invisible in the workspace and
    absent from the OSCAL export, i.e. work that silently evaporates. Ship
    read-only deliberately: this separates "does slot
    addressing work across 1600 param instances" from "does the editor
    behave", two failures that are miserable to debug together.

- id: "10"
  title: Edit one parameter from the control page
  description: >-
    Clicking an ODP slot opens an anchored popover that mounts odpEdit.ts for
    that single parameter -- value, status, rationale on override, the
    parameter's guidelines, and a deep link into the workspace. Closes the
    round trip: decide a parameter without losing the statement context that
    made it answerable.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Mount odpEdit.ts from story 7 -- do not write a second editing path, and
    do not call setDecision directly from the popover. The override-without-
    rationale refusal must produce the same message the workspace shows,
    because it is literally the same code. The deep link target
    (?view=individual&family=AC) is already supported by the workspace's
    switchToView, so no workspace changes are needed. PAYLOAD IS RESOLVED
    (measured 2026-09-29): embed the control's own param label/select/
    guidelines per page at build time from getCollection('controls') -- same
    Content Collection, AD-8 still applies, no new pipeline. Do NOT fetch
    odp-dataset.json from a control page: it is 736 KB as built (story 5's
    statementProse roughly doubled it), against a 343-byte median per-control
    payload and a 3.2 KB worst case (si-7-1, 16 params). Embed only what the
    popover needs -- statementProse is already on the page as rendered prose,
    so do not duplicate it into the payload. Keyboard operability
    is a requirement, not a follow-up: opens on Enter/Space, traps focus,
    closes on Escape, returns focus to the slot.

- id: "11"
  title: Batch scope in the control-page popover
  description: >-
    When a slot's parameter belongs to a dash-one cluster, the popover offers
    a second scope -- apply to all 18 dash-one controls -- with a live match
    count shown before anything is written. Brings CAP-1's batching to the
    place where the user actually encounters the parameter.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Reuse odpCluster.ts (groupDashOneClusters, computeClusterMatch) from
    story 2 unmodified -- never reimplement matching. Show the match count
    BEFORE applying: from inside AC-1 the user cannot see the other 17
    controls they are about to write to, so applying must never be a blind
    overwrite. The count is what makes this trustworthy. Payload follows
    story 10's resolved answer: precompute a paramId -> clusterKey membership
    index at build time and embed it alongside the per-control param payload,
    rather than shipping 1600 entries to run groupDashOneClusters
    client-side. Only the MEMBERSHIP index is precomputed -- member values
    come from odpStore (local, no payload) and the match count stays a fresh
    read-time computation per AD-11. AD-11 forbids STORING a cluster
    reference in a decision -- a build-time display index is not that, but
    state that explicitly in the story so the next reader does not flag it as
    a violation. Fan-out still writes N fully independent, individually
    overridable decisions.

- id: "12"
  title: Connective tissue between the browser and the workspace
  description: >-
    Four independently droppable additions: a per-control ODP summary, a
    family-page readiness column, links from workspace rows back out to their
    controls, and cross-tab sync via storage events.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Each bullet is separately verifiable and separately droppable -- do not
    let one block the others. Workspace rows currently show the control title
    as dead text, so there is no path from a parameter back to the control it
    governs; that link is the cheapest item here and probably the most used.
    Cross-tab sync narrows the spine's stated "last-write-wins, no
    BroadcastChannel sync" convention to "last-write-wins, with passive
    cross-tab refresh" -- a refinement rather than a contradiction, but
    record it in the spine rather than leaving the convention text stale.
    Reuse the dashboard's existing count logic for the per-control summary
    and the family column; do not write a third counter.

- id: "13"
  title: Control status store and per-item status control
  description: >-
    Add utils/statusStore.ts (AD-14) plus a status control on every control
    detail page and every enhancement fragment: incomplete / in-progress /
    compliant / not-applicable, with an owner field and a justification
    required for not-applicable. Also fixes the read-amplification in
    odpStore before a second store and a home dashboard inherit it.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    New invariant AD-14: status lives in ONE blob keyed `control-status`, not
    one per baseline. This is deliberately asymmetric with AD-10 -- ODP values
    genuinely differ between Moderate and High, implementation status does
    not, because you pursue one authorization. Record the reason in the spine
    or someone will "fix" the inconsistency later. Mirror odpStore's
    corrupt-safe contract exactly: missing or unparseable blob is empty state,
    never a crash, never a fabricated status. `not-applicable` requires a
    non-empty justification, refused at the store boundary, same idiom and
    same enforcement point as `overridden` requiring a rationale. Status must
    attach to ENHANCEMENTS as well as controls -- statusing base controls only
    covers 177 of 287 Moderate items, 62% of the obligation displayed as 100%.
    AD-4 does not change: the affordance is a per-fragment control inside
    EnhancementItem keyed by its own slug, not a new route. One status
    component used in both places, never two. Also in this story: getDecision
    calls readBlob which JSON.parses the whole blob, and computeDashboardCounts
    calls it once per entry -- 643 full parses per dashboard refresh today. Add
    a read-through cache invalidated on write, inside the module, no API
    change, and build statusStore with it from the start.

- id: "14"
  title: Evidence references
  description: >-
    Add a repeatable proof-of-completion field to the status record: a
    textarea for the note plus an optional URL, stored as a structured
    EvidenceRef with an automatically captured collectedAt date.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    The UI is a text box, but the STORED shape is structured from day one:
    { note, url, collectedAt }. Do NOT store uploaded files. Base64 in
    localStorage inflates ~33% against a ~5MB quota shared with the ODP
    decision blobs -- two screenshots exhausts it, and the failure is
    cross-feature and undiagnosable: setDecision starts returning false and
    the workspace silently refuses to save parameter decisions because of a
    file attached on a different page. A static site is also the wrong system
    of record for evidence artifacts (no access control, no retention, no
    backup); referencing where evidence already lives is both safer and closer
    to what an assessor wants. If file attachment is asked for, the answer is
    IndexedDB in its own story, not base64 here. collectedAt is captured
    automatically, never a user field -- evidence staleness is a real finding
    and the flag is trivial once the field exists, impossible to retrofit onto
    records that never captured it. Evidence URLs and notes are user input:
    escape them. This story makes story 18 non-optional, since evidence text
    is hand-written and exists nowhere else.

- id: "15"
  title: The ODP interlock -- compliant requires reviewed parameters
  description: >-
    A control cannot be marked compliant while any of its own ODPs is still
    unreviewed-default. A hard block naming the count, with a link to the
    outstanding parameters. The story that makes the workspace and the
    status tracker one product rather than two checklists.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Hard block, not a warning -- this mirrors the existing readiness gate,
    whose blocking behavior is the SPEC's own stated Success signal. A control
    marked compliant with three unreviewed parameters is a control whose
    implementation nobody specified: the "unexamined ceiling" from the SPEC's
    Why, one layer up. The item's parameter list comes from story 10's
    build-time per-control embed -- read that payload, do not fetch
    odp-dataset.json and do not add a second delivery path. Their statuses
    come from odpStore, which is local and needs no payload at all. The
    subtle part is the baseline dependency: status is
    per-system (AD-14) but the parameters gating it are per-baseline (AD-10),
    so the gate's verdict can legitimately differ between Moderate and High
    for the same item. That is correct, and the UI must state which baseline
    it is gating against. An item with zero parameters (89 of 287 in Moderate)
    is never blocked.

- id: "16"
  title: Compliance dashboard
  description: >-
    Add utils/complianceCount.ts (AD-15) and the dashboard: a hero number, an
    overall stacked horizontal bar, and a per-family breakdown, with baseline
    as a filter control above the chart.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    New invariant AD-15, one denominator rule set in one module: withdrawn
    never counted (182 of them); enhancements counted as first-class items;
    not-applicable EXCLUDED from the denominator entirely, never counted as
    complete; the 13 baseline-less PM controls included under every filter and
    labelled program-wide rather than silently dropped the way the workspace's
    baselines.includes() filter drops them today. Every percentage shows its
    raw fraction -- 64% (176/275) -- because a bare percentage over an
    invisible denominator is unauditable. Stacked horizontal bar, not a donut:
    a donut forces angle comparison, and the same mark serves the overall total
    and every family row. COLOR IS MEASURED, NOT CHOSEN: baseline must never be
    a color-encoded dimension here, because --color-baseline-low is green and a
    compliant-green sits DeltaE 7.9 from it under normal vision. Baseline stays
    a filter control. No red "incomplete" -- red against the compliant green
    fails deuteranopia separation at DeltaE 4.1. Use status-good #0ca30c and
    status-warning #fab219 only, with neutral gray for incomplete and neutral +
    45-degree hatch for not-applicable. Verify with
    `node scripts/validate_palette.js "#0ca30c,#fab219" --mode dark --surface
    "#161b22" --pairs all` before changing any of them. Status colors ship with
    label and icon, never color alone; a table view of the same numbers ships
    with the chart. Add dedicated status tokens to :root -- never reuse
    --color-baseline-* as chart fills.

- id: "17"
  title: Progressive home page
  description: >-
    Make the dashboard the front door without breaking the catalog: the
    family list when no data exists, the dashboard promoted above it once
    there is.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Do not simply replace index.astro. A first-time visitor would land on
    "0% complete -- 0/287", a poor front door for a catalog browser and a
    worse one for a portfolio piece; most visitors want to read NIST 800-53.
    Same route, conditional on whether either store holds data, and the
    catalog never disappears. The has-data check reads two stores and must
    not flash: render the catalog first and reveal the dashboard once the
    check resolves, never the reverse. With JS disabled the catalog renders
    exactly as it does today.

- id: "18"
  title: Backup, restore, and the storage budget
  description: >-
    A Download all data / Restore from file pair covering both blobs in one
    versioned envelope, plus a storage-budget indicator.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    OSCAL export is a product, not a backup -- it is lossy about owner,
    status and evidence notes, and cannot be re-imported. Losing an export is
    annoying, you regenerate it; losing hand-written evidence and N/A
    justifications is unrecoverable work living in exactly one browser
    profile. One envelope with its own version, not two files; both blobs'
    schemaVersion fields travel inside it. Restoring a file from a different
    schema version is refused with a clear message, never partially applied.
    Restore is the only destructive action in the app: it must confirm and
    must state what will be overwritten. The budget indicator shows real
    usage against the quota and warns before writes start failing.

- id: "19"
  title: Workflow accelerators
  description: >-
    Three independently droppable additions: bulk not-applicable by family
    with a structured inheritance justification, a baseline delta view, and a
    "what's blocking me" list.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Each bullet is separately verifiable and separately droppable -- do not
    let one block the others. Bulk N/A writes N independent records, each
    individually editable afterward, with the same fan-out discipline as
    AD-11's batch writes and for the same reason. Offer "inherited from
    provider" as a first-class justification type alongside free text: it is
    the most common real N/A reason and the one an assessor will actually ask
    about. Baseline delta ("Moving Moderate to High adds 121 items, 94 of them
    unstatused") is exactly answerable from data already loaded. "What's
    blocking me" is story 15's gate inverted -- items that would be compliant
    but for unreviewed ODPs -- and is more actionable than any percentage on
    the dashboard.

- id: "20"
  title: Cross-baseline decision proposals
  description: >-
    When a parameter is unreviewed in the working baseline but already
    decided in another, propose that value with its provenance and require an
    explicit confirm -- plus a bulk adopt that still records each as a
    deliberate review. Without this, finishing Moderate and switching to High
    means redoing 643 identical parameter decisions.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Grounding measurement (2026-09-29): Low is a strict subset of Moderate is
    a strict subset of High -- all 149 Low items are in Moderate, all 287
    Moderate items are in High. So a user who completes Moderate's 643
    parameters and switches to High meets 767, of which 643 are the identical
    controlSlug:paramId in a different blob, all reading unreviewed. This is
    the main path between the two most common baselines, not an edge case.
    NEVER auto-copy on baseline switch. It fabricates review status, the one
    thing odpStore is built never to do, and it is substantively wrong: High
    legitimately demands stricter values than Moderate for real parameters
    (scan frequency, log retention), so a blanket copy produces a High profile
    asserting Moderate's posture. That is precisely the unexamined-ceiling
    failure the SPEC's Why is written against, which is why the proposal must
    cost an act of review -- this story IS the product's own argument,
    implemented. A proposal leaves status at unreviewed-default and still
    counts as unreviewed in the readiness gate until confirmed. Storage stays
    per-baseline: this is a read across blobs, not a shape change, so AD-10 is
    untouched and there is no migration. Privacy barely participates (53 of
    its 96 items are privacy-only) -- do not build the UI around a four-way
    comparison. When several baselines hold a decision for the same param,
    propose from the NEAREST STRICTER one and name it; never merge them into
    one unattributed suggestion. Depends on story 8 only; neither blocks nor
    is blocked by stories 9-19.
